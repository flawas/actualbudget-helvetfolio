<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Red rounded background -->
  <rect width="32" height="32" rx="7" fill="#C8102E"/>
  <!-- Swiss cross: vertical bar -->
  <rect x="13" y="6" width="6" height="20" rx="1" fill="white"/>
  <!-- Swiss cross: horizontal bar -->
  <rect x="6" y="13" width="20" height="6" rx="1" fill="white"/>
  <!-- Rising trend line (blue, app accent) -->
  <polyline points="4,26 10,21 16,16 22,12 28,7"
    fill="none" stroke="#0071E3" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
