# Builds images from local source instead of pulling from a registry.
# Use this for local development and testing.
#
# Usage:
#   docker compose -f docker-compose.build.yml build
#   docker compose -f docker-compose.build.yml up -d helvetfolio-web
#   docker compose -f docker-compose.build.yml run --rm helvetfolio list

services:

  # One-shot CLI
  helvetfolio:
    build: .
    container_name: helvetfolio
    environment:
      ACTUAL_DATA_DIR: /app/data
      UPDATE_INTERVAL_MINUTES: ${UPDATE_INTERVAL_MINUTES:-60}
      PORTFOLIO_FILE: /app/data/portfolio.json
    volumes:
      - ./data:/app/data
    command: list

  # Background daemon
  helvetfolio-daemon:
    build: .
    container_name: helvetfolio-daemon
    environment:
      MODE: daemon
      ACTUAL_DATA_DIR: /app/data
      UPDATE_INTERVAL_MINUTES: ${UPDATE_INTERVAL_MINUTES:-60}
      PORTFOLIO_FILE: /app/data/portfolio.json
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Web UI
  helvetfolio-web:
    build: .
    container_name: helvetfolio-web
    environment:
      MODE: web
      ACTUAL_DATA_DIR: /app/data
      PORTFOLIO_FILE: /app/data/portfolio.json
      WEB_PORT: 3000
      WEB_PASSWORD: ${WEB_PASSWORD:-}
    volumes:
      - ./data:/app/data
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
